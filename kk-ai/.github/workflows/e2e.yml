name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - "kk-ai/apps/web-admin/**"
      - "kk-ai/services/mcp-hub/**"
  pull_request:
    branches: [main]
    paths:
      - "kk-ai/apps/web-admin/**"
      - "kk-ai/services/mcp-hub/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Frontend Dependencies
        run: |
          cd kk-ai
          pnpm install
          pnpm --filter @kk-ai/web-admin add -D @playwright/test

      - name: Install Playwright Browsers
        run: |
          cd kk-ai/apps/web-admin
          npx playwright install chromium

      - name: Install Backend Dependencies
        run: |
          cd kk-ai/services/mcp-hub
          pip install -r requirements.txt

      - name: Start Backend
        run: |
          cd kk-ai/services/mcp-hub
          export MCPHUB_REDIS_URL=redis://localhost:6379/0
          python run.py &
          sleep 5
          curl -f http://localhost:8000/health || exit 1

      - name: Run E2E Tests
        run: |
          cd kk-ai/apps/web-admin
          npx playwright test --project=chromium

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: kk-ai/apps/web-admin/playwright-report/
          retention-days: 7
