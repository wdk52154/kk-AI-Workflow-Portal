[project]
name = "service-content"
version = "0.1.0"
description = "自媒体运营 Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0","uvicorn[standard]>=0.30.0","pydantic>=2.0.0",
  "httpx>=0.27.0","pytest>=8.0.0","pytest-cov>=5.0.0","pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 50
