version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-hub:
    build:
      context: ./services/mcp-hub
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MCPHUB_REDIS_URL=redis://redis:6379/0
      - MCPHUB_DEBUG=false
      - MCPHUB_LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web-admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - mcp-hub
    restart: unless-stopped

volumes:
  redis-data:
